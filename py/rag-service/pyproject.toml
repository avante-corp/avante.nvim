[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service for avante.nvim"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "chromadb",
  "docx2txt", # Loaded by LlamaIndex's DOCX reader.
  "fastapi",
  "httpx",
  "llama-index-core",
  "llama-index-embeddings-dashscope",
  "llama-index-embeddings-ollama",
  "llama-index-embeddings-openai",
  "llama-index-embeddings-openai-like>=0.2.0",
  "llama-index-llms-dashscope",
  "llama-index-llms-ollama",
  "llama-index-llms-openai",
  "llama-index-llms-openai-like",
  "llama-index-llms-openrouter",
  "llama-index-readers-file",
  "llama-index-vector-stores-chroma",
  "markdownify",
  "openpyxl", # Loaded by LlamaIndex's XLSX reader.
  "pathspec",
  "pillow", # Loaded by LlamaIndex's PowerPoint reader.
  "pydantic",
  "transformers", # Loaded by LlamaIndex's PowerPoint reader.
  "tree-sitter-language-pack",
  "uvicorn",
  "watchdog",
]

[project.scripts]
avante-rag-service = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "service"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = ["src"]
