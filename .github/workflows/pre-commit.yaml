name: pre-commit

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]
  push:
    branches: [main, test-me-*]

jobs:
  pre-commit:
    if: "github.event.action != 'labeled' || github.event.label.name == 'pre-commit ci run'"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: gh pr edit ${{ github.event.number }} --remove-label 'pre-commit ci run'
      if: github.event.action == 'labeled' && github.event.label.name == 'pre-commit ci run'
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
      with:
        determinate: false
        extra-conf: |
          extra-substituters = https://avante-nvim.cachix.org
          extra-trusted-public-keys = avante-nvim.cachix.org-1:bxXX3jAkVDlvhLePyKfznp+rsvUpKm0onR8j0BuUKkA=
    # Needs to be installed before running pyright
    - name: setup rag service venv
      run: nix develop .#ci --command make rag-venv
    - name: Run pre-commit
      run: nix develop --command make pre-commit
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
