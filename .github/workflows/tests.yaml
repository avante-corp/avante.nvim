name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.lua"
      - ".github/**"
      - "crates/**"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "Build.ps1"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.lua"
      - ".github/**"
      - "crates/**"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "Build.ps1"
      - "scripts/**"

jobs:
  build-libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            feature: luajit
          - os: macos-latest
            arch: aarch64
            rust_target: aarch64-apple-darwin
            feature: luajit
          - os: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            feature: luajit

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/build
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          feature: ${{ matrix.feature }}
          rust_target: ${{ matrix.rust_target }}

      - name: Typecheck
        if: runner.os != 'Windows'
        run: nix develop .#ci --command make lua-typecheck

      - name: Run Lua tests
        if: runner.os != 'Windows'
        run: |
          nix develop .#ci --command nvim --version
          nix develop .#ci --command make luatest

      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            make rusttest CARGO_TARGET="${{ matrix.rust_target }}"
          else
            nix develop .#ci --command make rusttest CARGO_TARGET="${{ matrix.rust_target }}"
          fi

      - name: Run ACP native integration tests
        if: runner.os != 'Windows' && matrix.feature == 'luajit'
        run: >-
          nix develop .#ci --command make acp-integration-test
          CARGO_TARGET="${{ matrix.rust_target }}"

      - name: Run LLM native integration tests
        if: runner.os != 'Windows' && matrix.feature == 'luajit'
        run: >-
          nix develop .#ci --command make llm-integration-test
          CARGO_TARGET="${{ matrix.rust_target }}"
