name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-v*"

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  releases-matrix:
    needs: [create-release]
    if: needs.create-release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        feature: [lua51, luajit]
        config:
          - os: ubuntu-24.04-arm
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            docker_platform: linux/aarch64
            container: quay.io/pypa/manylinux2014_aarch64
          - os: ubuntu-latest
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            docker_platform: linux/amd64
            container: quay.io/pypa/manylinux2014_x86_64 # for glibc 2.17
          - os: macos-latest
            arch: x86_64
            rust_target: x86_64-apple-darwin
          - os: macos-latest
            arch: aarch64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-latest
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        id: build
        with:
          os: ${{ matrix.config.os }}
          arch: ${{ matrix.config.arch }}
          rust_target: ${{ matrix.config.rust_target }}
          docker_platform: ${{ matrix.config.docker_platform }}
          container: ${{ matrix.config.container }}

      - name: Upload Release Asset
        if: ${{ steps.build.outputs.os_name != 'windows' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l
          gh release upload "${{ needs.create-release.outputs.release_tag }}" \
            "./avante_lib-${{ steps.build.outputs.os_name }}-${{ matrix.config.arch }}-${{ matrix.feature }}.tar.gz" --clobber

      - name: Upload Release Asset (Windows)
        if: ${{ steps.build.outputs.os_name == 'windows' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release upload "${{ needs.create-release.outputs.release_tag }}"
            "./avante_lib-${{ steps.build.outputs.os_name }}-${{ matrix.config.arch }}-${{ matrix.feature }}.zip"
            --clobber

  luarocks-upload:
    needs: [create-release, releases-matrix]
    if: needs.create-release.outputs.release_created == 'true'
    uses: ./.github/workflows/luarocks.yml
    with:
      release_tag: ${{ needs.create-release.outputs.release_tag }}
    secrets: inherit
