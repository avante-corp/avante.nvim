name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-v*"
      - "main-tests"

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: release decision
    needs: [releases-matrix]
    if: always() && (github.ref_name == 'main-tests' || needs.releases-matrix.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # ratchet:dtolnay/rust-toolchain@1.94

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize release decision
        env:
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$PRS_CREATED" = "true" ]; then
            echo "Release PR created or updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Release PR created or updated." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RELEASE_CREATED" = "true" ]; then
            printf 'Release `%s` created. Publishing enabled.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new release. Publishing skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/install-nix
        if: steps.release.outputs.prs_created == 'true'

      # Post-hook: after the version bump, regenerate Cargo.lock
      # the "rust" release strategy doesn't work with buggy release-please
      # so we bump Cargo.toml as extra-file
      - name: Commit Cargo.lock update on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: ${{ fromJson(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          # bump just the avante components
          cargo update --workspace
          if git diff --exit-code Cargo.lock; then
            echo "Cargo.lock already valid. Not committing, exiting"
            exit 0
          fi

          # Recompute the vendored dependency hash used by flake.nix.
          nix run github:Mic92/nix-update -- --flake --version=skip avante-tokenizers

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock flake.nix
          git commit -m "chore: update Cargo.lock and cargoHash for version bump"
          git push origin "$BRANCH"

  releases-matrix:
    if: github.ref_name != 'main-tests'
    strategy:
      fail-fast: false
      matrix:
        feature: [lua51, luajit]
        config:
          - os: ubuntu-24.04-arm
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            docker_platform: linux/aarch64
            container: quay.io/pypa/manylinux2014_aarch64
          - os: ubuntu-latest
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            docker_platform: linux/amd64
            container: quay.io/pypa/manylinux2014_x86_64 # for glibc 2.17
          - os: macos-latest
            arch: x86_64
            rust_target: x86_64-apple-darwin
          - os: macos-latest
            arch: aarch64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-latest
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        id: build
        with:
          os: ${{ matrix.config.os }}
          arch: ${{ matrix.config.arch }}
          feature: ${{ matrix.feature }}
          rust_target: ${{ matrix.config.rust_target }}
          docker_platform: ${{ matrix.config.docker_platform }}
          container: ${{ matrix.config.container }}

      - name: Store Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: avante_lib-${{ steps.build.outputs.os_name }}-${{ matrix.config.arch }}-${{ matrix.feature }}
          path: ./avante_lib-${{ steps.build.outputs.os_name }}-${{ matrix.config.arch }}-${{ matrix.feature }}.*
          if-no-files-found: error

  luarocks-upload:
    needs: [create-release]
    if: needs.create-release.outputs.release_created == 'true'
    uses: ./.github/workflows/luarocks.yml
    with:
      tag: ${{ needs.create-release.outputs.release_tag }}
    secrets:
      LUX_API_KEY: ${{ secrets.LUX_API_KEY }}

  upload-release-assets:
    needs: [create-release]
    if: needs.create-release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avante_lib-*
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
