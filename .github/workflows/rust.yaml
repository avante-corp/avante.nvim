name: Rust CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "lua/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "lua/**"
      - "**/*.md"

jobs:
  tests:
    name: Run Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # should match the flake toolchain
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - name: Run rust tests
        run: make rusttest
