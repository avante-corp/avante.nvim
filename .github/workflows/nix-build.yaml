name: nix-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          # - system: aarch64-linux
          #   os: ubuntu-24.04-arm
          # - system: x86_64-darwin
          #   os: macos-15-intel
          # - system: aarch64-darwin
          #   os: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://avante-nvim.cachix.org
            extra-trusted-public-keys = avante-nvim.cachix.org-1:bxXX3jAkVDlvhLePyKfznp+rsvUpKm0onR8j0BuUKkA=

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: avante-nvim
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build all flake outputs
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          installables=()
          # Apps reference packages built here; shells also build their dependencies.
          for kind in packages devShells; do
            names=$(nix eval --json ".#${kind}.${SYSTEM}" --apply builtins.attrNames)
            while IFS= read -r name; do
              installables+=(".#${kind}.${SYSTEM}.\"${name}\"^*")
            done < <(jq -r '.[]' <<< "$names")
          done
          nix build --no-link --print-build-logs --keep-going "${installables[@]}"
