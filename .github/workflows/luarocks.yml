name: Push to luarocks.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.4.3)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
    secrets:
      LUX_API_KEY:
        required: true
  push:
    tags:
      - '*'
  release:
    types:
      - created

jobs:
  luarocks-upload:
    if: github.repository == 'avante-corp/avante.nvim'
    runs-on: ubuntu-24.04
    steps:
      - name: Get Version
        env:
          LUAROCKS_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: echo "LUAROCKS_VERSION=$LUAROCKS_VERSION" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.LUAROCKS_VERSION }}
          fetch-depth: 0 # Required to count the commits
      - name: LuaRocks Upload
        uses: nvim-neorocks/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUX_API_KEY }}
        with:
          version: ${{ env.LUAROCKS_VERSION }}
