name: Push to luarocks.org

on:
  push:
    # to upload dev version
    branches: [main]
  pull_request:
  workflow_dispatch:
  #   tags:
  #     - '*'
  # release:
  #   types:
  #     - created

jobs:
  luarocks-upload:
    if: github.repository == 'avante-corp/avante.nvim'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to count the commits
      - name: Get Version
        run: |
          echo "LUAROCKS_VERSION=$(git describe --abbrev=0 --tags)" >> "$GITHUB_ENV"
      - name: LuaRocks Upload
        # work around safety that prevents push on PRs
        # https://github.com/lumen-oss/luarocks-tag-release/issues/1039
        uses: teto/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUX_API_KEY }}
        with:
          version: dev
          # version: ${{ env.LUAROCKS_VERSION }}
