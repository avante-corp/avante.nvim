name: Install Nix
description: Install Nix and configure the Avante Cachix binary cache
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # ratchet:DeterminateSystems/nix-installer-action@v23
      with:
        determinate: false
        extra-conf: |
          extra-substituters = https://avante-nvim.cachix.org
          extra-trusted-public-keys = avante-nvim.cachix.org-1:bxXX3jAkVDlvhLePyKfznp+rsvUpKm0onR8j0BuUKkA=
          accept-flake-config = true
