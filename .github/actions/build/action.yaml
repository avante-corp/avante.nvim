---
name: Build avante libraries
description: shared action used in test and release avante workflows
inputs:
  os:
    description: github input type as used in "runs-on"
    required: true
  arch:
    description: one of aarch64, x86_64
  feature:
    description: Lua runtime feature (lua51 or luajit)
    required: true
  rust_target:
    # can we do without ?
    description: e.g. "aarch64-pc-windows-msvc"
  docker_platform:
    description: for example "linux/amd64"
  container:
    description: for instance quay.io/pypa/manylinux2014_x86_64 # for glibc 2.17
outputs:
  os_name:
    description: Platform name used in release asset filenames
    value: ${{ steps.platform.outputs.os_name }}

runs:
  using: "composite"
  steps:
    - name: Identify platform
      id: platform
      shell: bash
      run: |
        case "${{ inputs.os }}" in
          ubuntu-*) echo "os_name=linux" >> "$GITHUB_OUTPUT" ;;
          macos-*) echo "os_name=darwin" >> "$GITHUB_OUTPUT" ;;
          windows-*) echo "os_name=windows" >> "$GITHUB_OUTPUT" ;;
          *) echo "Unsupported runner: ${{ inputs.os }}" >&2; exit 1 ;;
        esac

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

    - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # ratchet:dtolnay/rust-toolchain@1.94
      if: ${{ inputs.container == null }}
      with:
        targets: ${{ inputs.rust_target }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # ratchet:Swatinem/rust-cache@v2
      if: ${{ inputs.container == null }}
      with:
        key: ${{ inputs.rust_target }}-${{ inputs.feature }}

    - name: Install Nix
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      uses: ./.github/actions/install-nix

    - name: Install avante dependencies
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      shell: bash
      run: nix develop .#ci --command make setup-deps

    - name: Build all crates (Linux)
      shell: bash
      if: ${{ inputs.container == null && steps.platform.outputs.os_name == 'linux' }}
      env:
        CARGO_TARGET: ${{ inputs.rust_target }}
      run: |
        set -x
        mkdir -p ~/.cache/nvim
        nix develop .#ci --command nvim -V3nvim.log --headless -u NONE \
          --cmd "set rtp^=." \
          --cmd 'lua package.path = "./target/tests/deps/share/lua/5.1/?.lua;./target/tests/deps/share/lua/5.1/?/init.lua;" .. package.path' \
          -c "runtime plugin/avante.lua" \
          -c "lua vim.g.avante = { debug = vim.log.levels.INFO }" \
          -c "AvanteBuild source=true" +quit!

        # to help diagnose failures
        cat nvim.log
        ls -la lua

    - name: Build all crates (macOS)
      if: ${{ steps.platform.outputs.os_name == 'darwin' }}
      shell: bash
      run: |
        # Build outside Nix to avoid dependencies on /nix/store.
        make "${{ inputs.feature }}" CARGO_TARGET="${{ inputs.rust_target }}"

    - name: Verify macOS libraries
      if: ${{ steps.platform.outputs.os_name == 'darwin' }}
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        for library in lua/*.so; do
          lipo "$library" -verify_arch "${ARCH/aarch64/arm64}"
          dependencies=$(otool -L "$library")
          printf '%s\n' "$dependencies"
          if [[ "$dependencies" == *"/nix/store/"* ]]; then
            echo "Non-portable Nix dependency in $library" >&2
            exit 1
          fi
        done

    - name: Build all crates (Linux) with glibc 2.17 # for glibc 2.17
      shell: bash
      if: ${{ inputs.container != null }}
      run: |
        # sudo apt-get install -y qemu qemu-user-static
        ./scripts/build-in-container.sh "${{ inputs.docker_platform }}" \
            "${{ inputs.container }}" "${{ inputs.feature }}"

    - name: Handle binaries (Linux/MacOS)
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      shell: bash
      run: |
        (cd lua && tar cvf - *.so | gzip ) > avante_lib-${{ steps.platform.outputs.os_name }}-${{ inputs.arch }}-${{ inputs.feature }}.tar.gz

    - name: Build all crates (Windows)
      if: ${{ steps.platform.outputs.os_name == 'windows' }}
      shell: pwsh
      run: ./Build.ps1 -BuildFromSource true -Version "${{ inputs.feature }}" -Target "${{ inputs.rust_target }}"

    - name: Handle binaries (Windows)
      if: ${{ steps.platform.outputs.os_name == 'windows' }}
      shell: pwsh
      run: |
        Compress-Archive -Path "lua/avante_*.dll" -DestinationPath "avante_lib-${{ steps.platform.outputs.os_name }}-${{ inputs.arch }}-${{ inputs.feature }}.zip"
