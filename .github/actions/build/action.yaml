---
name: Build avante libraries
description: shared action used in test and release avante workflows
inputs:
  os:
    description: github input type as used in "runs-on"
    required: true
  arch:
    description: one of aarch64, x86_64
  rust_target:
    # can we do without ?
    description: e.g. "aarch64-pc-windows-msvc"
  docker_platform:
    description: for example "linux/amd64"
  container:
    description: for instance quay.io/pypa/manylinux2014_x86_64 # for glibc 2.17
outputs:
  os_name:
    description: Platform name used in release asset filenames
    value: ${{ steps.platform.outputs.os_name }}

runs:
  using: "composite"
  steps:
    - name: Identify platform
      id: platform
      shell: bash
      run: |
        case "${{ inputs.os }}" in
          ubuntu-*) echo "os_name=linux" >> "$GITHUB_OUTPUT" ;;
          macos-*) echo "os_name=darwin" >> "$GITHUB_OUTPUT" ;;
          windows-*) echo "os_name=windows" >> "$GITHUB_OUTPUT" ;;
          *) echo "Unsupported runner: ${{ inputs.os }}" >&2; exit 1 ;;
        esac

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # ratchet:Swatinem/rust-cache@v2
      if: ${{ inputs.container == null }}

    - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # ratchet:dtolnay/rust-toolchain@1.94
      if: ${{ inputs.container == null }}
      with:
        targets: ${{ inputs.rust_target }}

    - name: Install Nix
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # ratchet:DeterminateSystems/nix-installer-action@v23

    - name: Install avante dependencies
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      shell: bash
      run: nix develop .#ci --command make setup-deps

    - name: Build all crates (Linux/MacOS)
      shell: bash
      if: ${{ inputs.container == null && steps.platform.outputs.os_name != 'windows' }}
      run: |
        set -x
        mkdir -p ~/.cache/nvim
        nix develop .#ci --command nvim -V3nvim.log --headless -u NONE \
          --cmd "set rtp^=." \
          --cmd 'lua package.path = "./target/tests/deps/share/lua/5.1/?.lua;./target/tests/deps/share/lua/5.1/?/init.lua;" .. package.path' \
          -c "runtime plugin/avante.lua" \
          -c "lua vim.g.avante = { debug = vim.log.levels.INFO }" \
          -c "AvanteBuild source=true" +quit!

        # to help diagnose failures
        cat nvim.log
        ls -la lua

    - name: Build all crates (Linux) with glibc 2.17 # for glibc 2.17
      shell: bash
      if: ${{ inputs.container != null }}
      run: |
        # sudo apt-get install -y qemu qemu-user-static
        ./scripts/build-in-container.sh "${{ inputs.docker_platform }}" \
            "${{ inputs.container }}" "${{ matrix.feature }}"

    - name: Handle binaries (Linux/MacOS)
      if: ${{ steps.platform.outputs.os_name != 'windows' }}
      shell: bash
      run: |
        # AvanteBuild put the libraries in `lua/`
        (cd lua && tar cvf - *.so | gzip ) > avante_lib-${{ steps.platform.outputs.os_name }}-${{ inputs.arch }}-${{ matrix.feature }}.tar.gz

    - name: Build all crates (Windows)
      if: ${{ steps.platform.outputs.os_name == 'windows' }}
      shell: bash
      run: |
        # TODO run AvanteBuild instead
        cargo build --release --no-default-features --features ${{ matrix.feature }} --target ${{ inputs.rust_target }} -p avante-tokenizers -p avante-templates -p avante-repo-map -p avante-html2md -p avante-acp

    - name: Handle binaries (Windows)
      if: ${{ steps.platform.outputs.os_name == 'windows' }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path results

        # we can probably remove that
        $TargetDir = "target\${{ inputs.rust_target }}\release"
        Copy-Item -Path "$TargetDir\avante_templates.dll" -Destination "avante_templates.dll"
        Copy-Item -Path "$TargetDir\avante_tokenizers.dll" -Destination "avante_tokenizers.dll"
        Copy-Item -Path "$TargetDir\avante_repo_map.dll" -Destination "avante_repo_map.dll"
        Copy-Item -Path "$TargetDir\avante_html2md.dll" -Destination "avante_html2md.dll"
        Copy-Item -Path "$TargetDir\avante_acp.dll" -Destination "avante_acp.dll"

        $dllFiles = Get-ChildItem -Filter "*.dll" | Select-Object -ExpandProperty Name
        Compress-Archive -Path $dllFiles -DestinationPath "avante_lib-${{ steps.platform.outputs.os_name }}-${{ inputs.arch }}-${{ matrix.feature }}.zip"
