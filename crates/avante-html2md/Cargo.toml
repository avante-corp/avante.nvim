[lib]
crate-type = ["cdylib"]

[package]
name = "avante-html2md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
htmd = "0.5.5"
html2md = "0.2.17"
mlua.workspace = true
reqwest = { version = "0.13.4", features = ["blocking", "native-tls-vendored"] }

[lints]
workspace = true

[features]
default = ["luajit"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
luajit = ["mlua/luajit"]
